[package]
name = "execsnoop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
execsnoop-common = { path = "../execsnoop-common", features = ["user"] }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "net", "signal", "time"] }

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
# BPF 크레이트를 의존성으로 적어 두면 cargo가 그 소스 변경을 감지해 build.rs를 다시 돌린다
execsnoop-ebpf = { path = "../execsnoop-ebpf" }

[[bin]]
name = "execsnoop"
path = "src/main.rs"
