# 08장: 07장 execsnoop을 Rust Aya로 다시 작성 — 워크스페이스 구조는 aya-rs/aya-template을 따랐다.
[workspace]
resolver = "2"
members = ["execsnoop", "execsnoop-common", "execsnoop-ebpf"]
# execsnoop-ebpf는 BPF 타깃 전용이라 기본 빌드 대상에서 뺀다. execsnoop의 build.rs가 따로 빌드한다.
default-members = ["execsnoop", "execsnoop-common"]

[workspace.package]
license = "MIT"
edition = "2024"

[workspace.dependencies]
aya = { version = "=0.14.0", default-features = false }
aya-build = { version = "=0.2.0", default-features = false }
aya-ebpf = { version = "=0.2.1", default-features = false }

anyhow = { version = "1", default-features = false }
cargo_metadata = { version = "0.23.0", default-features = false }
libc = { version = "0.2.159", default-features = false }
tokio = { version = "1.47", default-features = false }
which = { version = "6.0.0", default-features = false }

[profile.release.package.execsnoop-ebpf]
debug = 2
codegen-units = 1
strip = false
